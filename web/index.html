<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f1">
<title>전자칠판</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/board.css?v=0.7.0">
</head>
<!-- data-v 는 서버 버전(src/room.ts SERVER_VERSION)과 같게 올립니다. 다르면 전자칠판이 스스로 새로 고칩니다. -->
<body data-v="0.7.0">
<script>/* 막대 위치를 먼저 정해 깜박임 방지(기본: 아래) */ try { if (localStorage.getItem('eboard.barBottom') !== 'false') document.body.classList.add('bar-bottom'); } catch (e) { document.body.classList.add('bar-bottom'); }</script>
  <header id="topbar">
    <button id="btn-class" class="chip" type="button"><span id="class-label">학급 선택</span></button>
    <span id="session-label" class="session"></span>
    <span id="lesson-label" class="lesson-label" hidden></span>
    <nav class="pages" aria-label="페이지">
      <button id="btn-prev" type="button" title="이전 페이지" aria-label="이전 페이지">‹</button>
      <span id="page-label">-</span>
      <button id="btn-next" type="button" title="다음 페이지" aria-label="다음 페이지">›</button>
      <button id="btn-new" type="button" title="새 페이지">＋ 새 페이지</button>
    </nav>
    <div id="quickbar" class="quickbar" aria-label="자주 쓰는 도구"></div>
    <div class="right">
      <span id="peers" class="muted"></span>
      <span id="conn" data-state="wait"><i></i><span id="conn-text">연결 중</span> <span id="rtt" class="muted"></span></span>
      <button id="btn-full" type="button" title="전체 화면" aria-label="전체 화면">⛶</button>
      <div class="menu-wrap">
        <button id="btn-menu" type="button" title="메뉴" aria-label="메뉴">⋯</button>
        <div id="menu" class="menu" hidden>
          <button id="menu-new-session" type="button">새 수업 시작</button>
          <!-- 아래 네 가지는 다음 단계에서 엽니다(기록·명단·진도·시간표). 합반은 서버판에만 있습니다. -->
          <button id="menu-joint" type="button" hidden>합반 수업</button>
          <button id="menu-history" type="button">판서 기록</button>
          <button id="menu-roster" type="button" hidden>학급 명단 관리</button>
          <button id="menu-plan" type="button" hidden>주간 진도·차시 자료</button>
          <button id="menu-settings" type="button">교시·시간표 설정</button>
          <button id="menu-penonly" type="button">펜 전용 (손가락은 이동·확대)</button>
          <button id="menu-pos" type="button">메뉴 막대 위·아래 바꾸기</button>
          <button id="menu-side" type="button">도구 막대 좌우 바꾸기</button>
          <button id="menu-devices" type="button">등록된 전자칠판</button>
          <button id="menu-logout" type="button">로그아웃</button>
        </div>
      </div>
    </div>
  </header>

  <div id="rollover" class="banner rollover" hidden>
    <span id="rollover-text"></span>
    <button id="rollover-continue" type="button" class="chip"></button>
    <button id="rollover-close" type="button" class="chip">닫기</button>
  </div>

  <div id="workspace">
    <aside id="toolbar" aria-label="도구"></aside>
    <div id="stage"></div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <div id="update-banner" class="banner" hidden>
    새 버전이 나왔습니다. <button type="button" class="chip" id="update-reload">새로 고침</button>
  </div>

  <div id="bell-banner" class="banner" hidden>
    교시 시각이 아직 기본값입니다. 학교 종 시각에 맞춰야 판서가 교시별로 바르게 기록됩니다.
    <button type="button" class="chip" id="bell-banner-go">교시 시각 설정</button>
    <button type="button" class="chip" id="bell-banner-x">나중에</button>
  </div>

  <div id="login-needed" class="banner" hidden>
    로그인이 만료되었습니다. <a href="login.html">다시 로그인</a>
  </div>

  <dialog id="picker">
    <h2>칠판 시작</h2>
    <p class="muted">이 기기</p>
    <div id="picker-devices" class="chips"></div>
    <div id="picker-register" class="register" hidden>
      <label class="check"><input type="checkbox" id="reg-on" checked> 이 기기를 전자칠판으로 등록 (로그인 없이 계속 사용, 교사 PIN 으로 잠금)</label>
      <div class="pin-fields">
        <label><span id="reg-pin-label">PIN</span>
          <input id="reg-pin" type="password" inputmode="numeric" pattern="\d*" maxlength="6" autocomplete="off"></label>
        <label>PIN 확인
          <input id="reg-pin2" type="password" inputmode="numeric" pattern="\d*" maxlength="6" autocomplete="off"></label>
      </div>
      <p class="muted small">등록하면 이 기기에 교사 로그인을 남기지 않습니다. 지난 기록 열기·등록 해제에는 PIN 이 필요합니다.</p>
    </div>
    <p class="muted">학급</p>
    <div id="picker-classes" class="chips"></div>
  </dialog>

  <dialog id="devmenu">
    <h2>전자칠판 설정</h2>
        <div id="devmenu-classes" class="chips"></div>
    <div class="row-end">
      <button id="devmenu-revoke" type="button" class="chip danger">이 기기 등록 해제</button>
      <button id="devmenu-close" type="button" class="chip">닫기</button>
    </div>
  </dialog>

  <dialog id="devlist">
    <h2>등록된 전자칠판</h2>
    <div id="devlist-items"></div>
    <div class="row-end"><button id="devlist-close" type="button" class="chip">닫기</button></div>
  </dialog>

  <script type="module" src="js/app.js?v=0.7.0"></script>
</body>
</html>
