<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f1">
<title>전자칠판 · 학생</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/board.css?v=0.10.1">
<link rel="stylesheet" href="css/student.css?v=0.10.1">
<style>
  .stu-nums { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px; width: min(560px, 100%); }
  .stu-nums button { min-height: 60px; border-radius: 14px; border: 1px solid var(--line); background: #fff; font-size: 22px; font-weight: 700; cursor: pointer; }
  .stu-nums button:active { background: var(--accent); color: #fff; }
  .stu-code { display: flex; gap: 8px; width: min(420px, 100%); }
  .stu-code input { flex: 1; min-height: 56px; font-size: 26px; letter-spacing: .3em; text-align: center; border: 1px solid var(--line); border-radius: 14px; }
  .stu-code button { min-width: 96px; }
</style>
</head>
<!-- data-v 는 서버 버전(src/room.ts SERVER_VERSION)과 같게 올립니다. -->
<body class="student" data-v="0.10.1">
  <header id="topbar">
    <strong id="me"></strong>
    <span id="mode-label" class="session"></span>
    <div class="right">
      <button id="btn-change" type="button" class="chip" hidden>번호 바꾸기</button>
      <span id="conn" data-state="wait"><i></i><span id="conn-text">연결 중</span></span>
    </div>
  </header>

  <!-- 들어오기: QR 로 들어오면 코드가 이미 채워져 있고, 번호만 고르면 됩니다 -->
  <main id="join" class="stu-screen" hidden>
    <h1 id="join-title">학급 코드를 넣으세요</h1>
    <p class="muted" id="join-desc">칠판에 보이는 QR 코드를 찍거나, 코드 6자리를 넣으세요.</p>
    <form class="stu-code" id="join-code-form">
      <input id="join-code" inputmode="numeric" pattern="[0-9]*" maxlength="7" autocomplete="off" spellcheck="false" placeholder="숫자 6자리" aria-label="학급 코드">
      <button type="submit" class="stu-big">확인</button>
    </form>
    <div class="stu-nums" id="join-nums" hidden></div>
    <p class="muted small" id="join-err"></p>
  </main>

  <main id="wait" class="stu-screen" hidden>
    <div class="stu-wait-icon" aria-hidden="true">✋</div>
    <h1>선생님이 부르면 여기에 나타납니다</h1>
    <p class="muted">이 화면을 열어 두세요.</p>
  </main>

  <main id="invite" class="stu-screen" hidden>
    <h1 id="invite-title"></h1>
    <p id="invite-desc" class="muted"></p>
    <div class="stu-actions">
      <button type="button" class="stu-big" id="invite-ok">시작하기</button>
      <button type="button" class="stu-small" id="invite-no">지금은 못 해요</button>
    </div>
  </main>

  <!-- 사진 보내기는 저장판에서 엽니다 -->
  <main id="photo" class="stu-screen" hidden>
    <h1>사진 보내기</h1>
    <p class="muted" id="photo-msg"></p>
    <div class="stu-preview" id="photo-preview" hidden><img alt="보낼 사진"></div>
    <div class="stu-actions">
      <label class="stu-big"><input type="file" accept="image/*" capture="environment" id="photo-cam" hidden>사진 찍기</label>
      <label class="stu-small"><input type="file" accept="image/*" id="photo-file" hidden>앨범에서 고르기</label>
      <button type="button" class="stu-big send" id="photo-send" hidden>보내기</button>
    </div>
    <div class="md-progress" id="photo-progress" hidden><i></i><span></span></div>
  </main>

  <div id="solve" hidden>
    <div id="workspace">
      <aside id="toolbar" class="stu-bar" aria-label="도구"></aside>
      <div id="stage"></div>
    </div>
    <div class="stu-solve-bar">
      <span class="muted" id="solve-msg">칠판에 바로 보입니다. 내가 쓴 것만 지울 수 있어요.</span>
      <button type="button" class="stu-hand" id="solve-hand" hidden>✋ 손들기</button>
      <button type="button" class="stu-done" id="solve-done">다 했어요</button>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="login-needed" class="banner" hidden></div>

  <script type="module" src="js/student.js?v=0.10.1"></script>
</body>
</html>
